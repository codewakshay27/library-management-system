<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="background: linear-gradient(135deg,#0f172a,#1e293b); color:white;">

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="p-4" style="width:250px; background:#0f172a; min-height:100vh;">

        <h4 class="mb-4">
            <i class="fas fa-user-shield"></i> Admin Panel
        </h4>

        <hr style="border-color:#334155;">

        <a href="/admin/dashboard" class="d-block mb-3 text-white text-decoration-none">
            <i class="fas fa-chart-line"></i> Dashboard
        </a>

        <a href="/add/book" class="d-block mb-3 text-white text-decoration-none">
            <i class="fas fa-plus"></i> Add Book
        </a>

        <a href="/remove/book" class="d-block mb-3 text-white text-decoration-none">
            <i class="fas fa-trash"></i> Remove Book
        </a>

        <a href="/logout" class="d-block mt-4 text-danger text-decoration-none">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>

    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-5">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
