<nav class="fixed top-0 left-0 w-full bg-transparent z-50">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex items-center justify-between h-16">

      <!-- Logo / Brand -->
      <a href="/" class="flex items-center gap-2 brand-pill">
        <span class="text-lg">📚</span>
        <span class="hidden sm:inline font-bold tracking-wide">Smart Library</span>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center gap-3 text-sm font-medium">

        <a href="/" class="nav-link nav-btn flex items-center gap-2">
          <i class="fas fa-home"></i> Home
        </a>

        {% if current_user.is_authenticated %}
          {% if current_user.admin %}

            <a href="/add/book" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-plus"></i> Add Book
            </a>

            <a href="/remove/book" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-trash"></i> Remove Book
            </a>

            <a href="/admin/dashboard" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-chart-line"></i> Dashboard
            </a>

            <button class="nav-link nav-btn flex items-center gap-2"
                    onclick="toggleAdminSidebar()">
              <i class="fas fa-user-shield"></i>
              {{ current_user.name }}
            </button>

            <a href="/logout" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>

          {% else %}

            <a href="/issue/book" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-book"></i> Issue
            </a>

            <a href="/return/book" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-undo"></i> Return
            </a>

            <a href="/dashboard" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-chart-line"></i> Dashboard
            </a>

            <button class="nav-link nav-btn flex items-center gap-2"
                    onclick="toggleProfileSidebar()">
              <i class="fas fa-user-circle"></i>
              {{ current_user.name }}
            </button>

            <a href="/logout" class="nav-link nav-btn flex items-center gap-2">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>

          {% endif %}
        {% else %}

          <button class="nav-link nav-btn flex items-center gap-2"
                  onclick="openLogin()">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>

          <button class="nav-link nav-btn flex items-center gap-2"
                  onclick="openRegister()">
            <i class="fas fa-user-plus"></i> Register
          </button>

          <a href="/about" class="nav-link nav-btn flex items-center gap-2">
            <i class="fas fa-info-circle"></i> About
          </a>

        {% endif %}

      </div>

      <!-- Mobile Toggle -->
      <button class="md:hidden nav-btn px-3 py-2 rounded-lg" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
      </button>

    </div>
  </div>
</nav>
