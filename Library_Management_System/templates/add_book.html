{% extends "layouts/base.html" %}
{% block title %}Add Book{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto pt-24 px-4">

    <form action="/add/book" method="POST"
          class="bg-white shadow-xl rounded-2xl p-8 border border-slate-200">

        <!-- Flash Messages -->
        {% for message in get_flashed_messages() %}
        <div class="mb-4 bg-yellow-100 border border-yellow-300 text-yellow-800 px-4 py-3 rounded-lg flex justify-between items-center">
            <span>{{ message }}</span>
            <button type="button"
                    onclick="this.parentElement.remove()"
                    class="text-yellow-700 hover:text-yellow-900 text-lg">
                &times;
            </button>
        </div>
        {% endfor %}

        <h1 class="text-3xl font-bold text-center text-slate-800 mb-8">
            Add Book
        </h1>

        <!-- Book Name -->
        <div class="mb-5">
            <label class="block text-slate-600 mb-2">Book Name</label>
            <div class="flex items-center border rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500">
                <i class="fa fa-book text-slate-400 mr-3"></i>
                <input type="text"
                       name="name"
                       placeholder="Book Name"
                       required
                       class="w-full py-2 outline-none">
            </div>
        </div>

        <!-- Author -->
        <div class="mb-5">
            <label class="block text-slate-600 mb-2">Author Name</label>
            <div class="flex items-center border rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500">
                <i class="fa fa-user text-slate-400 mr-3"></i>
                <input type="text"
                       name="author"
                       placeholder="Author Name"
                       required
                       class="w-full py-2 outline-none">
            </div>
        </div>

        <!-- Category -->
        <div class="mb-5">
            <label class="block text-slate-600 mb-2">Category</label>
            <div class="flex items-center border rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500">
                <i class="fa fa-list text-slate-400 mr-3"></i>
                <select name="category"
                        required
                        class="w-full py-2 outline-none bg-transparent">
                    <option value="">Select Category</option>
                    {% for category in categories %}
                        <option value="{{ category.name }}">
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Total Copies -->
        <div class="mb-5">
            <label class="block text-slate-600 mb-2">Total Copies</label>
            <div class="flex items-center border rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500">
                <i class="fa fa-copy text-slate-400 mr-3"></i>
                <input type="number"
                       name="copies"
                       placeholder="Total Copies"
                       min="1"
                       required
                       class="w-full py-2 outline-none">
            </div>
        </div>

        <!-- Description -->
        <div class="mb-6">
            <label class="block text-slate-600 mb-2">Book Description</label>
            <textarea name="description"
                      rows="3"
                      placeholder="Book Description"
                      required
                      class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold transition">
            Add Book
        </button>

    </form>

</div>

{% endblock %}
