{% extends "layouts/base.html" %}
{% block title %}Analytics{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto px-6 pt-24">

    <h2 class="text-3xl font-bold text-center text-slate-800 mb-12">
        System Analytics
    </h2>

    <!-- STAT CARDS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">

        <div class="bg-white rounded-xl shadow border border-slate-200 p-8">
            <h5 class="text-slate-500 mb-2">Total Users</h5>
            <h2 class="text-4xl font-bold text-blue-600">
                {{ total_users }}
            </h2>
        </div>

        <div class="bg-white rounded-xl shadow border border-slate-200 p-8">
            <h5 class="text-slate-500 mb-2">Total Books</h5>
            <h2 class="text-4xl font-bold text-green-600">
                {{ total_books }}
            </h2>
        </div>

        <div class="bg-white rounded-xl shadow border border-slate-200 p-8">
            <h5 class="text-slate-500 mb-2">Books Currently Issued</h5>
            <h2 class="text-4xl font-bold text-orange-500">
                {{ total_issued }}
            </h2>
        </div>

    </div>

    <!-- GRAPH CARD -->
    <div class="bg-white rounded-xl shadow border border-slate-200 p-8 mt-16">
        <canvas id="analyticsChart"></canvas>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const ctx = document.getElementById('analyticsChart');
    if (!ctx) return;

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Users', 'Books', 'Issued'],
            datasets: [{
                label: 'Library Statistics',
                data: [
                    {{ total_users }},
                    {{ total_books }},
                    {{ total_issued }}
                ],
                backgroundColor: [
                    'rgba(59,130,246,0.8)',   // Blue
                    'rgba(34,197,94,0.8)',    // Green
                    'rgba(249,115,22,0.8)'    // Orange
                ],
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#1e293b'
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: '#334155'
                    }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        color: '#334155'
                    }
                }
            }
        }
    });

});
</script>

{% endblock %}
