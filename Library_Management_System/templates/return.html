{% extends "layouts/base.html" %}
{% block title %}Return Book{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto pt-24 px-4">

    <form action="/return/book" method="POST"
          class="bg-white shadow-xl rounded-2xl p-8 border border-slate-200">

        <!-- Flash Messages -->
        {% for message in get_flashed_messages() %}
        <div class="mb-4 bg-yellow-100 border border-yellow-300 text-yellow-800 px-4 py-3 rounded-lg">
            {{ message }}
        </div>
        {% endfor %}

        <h1 class="text-3xl font-bold text-center text-slate-800 mb-8">
            Return Book
        </h1>

        {% if books %}

        <!-- Select Book -->
        <div class="mb-6">
            <label class="block text-slate-600 mb-2">
                Select Book to Return
            </label>

            <div class="flex items-center border rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500">
                <i class="fa fa-book text-slate-400 mr-3"></i>

                <select name="book"
                        required
                        class="w-full py-3 outline-none bg-transparent">
                    <option value="" disabled selected>
                        Select Book to Return
                    </option>

                    {% for copy in books %}
                    <option value="{{ copy.id }}">
                        {{ copy.book_obj.name }} by {{ copy.book_obj.author }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold transition shadow">
            Return Book
        </button>

        {% else %}

        <div class="bg-blue-100 border border-blue-300 text-blue-700 px-6 py-4 rounded-lg text-center">
            You have no books to return.
        </div>

        {% endif %}

    </form>

</div>

{% endblock %}
