<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans&display=swap" rel="stylesheet">

    <link rel="icon" href="{{ url_for('static',filename='user.png')}}">

    <title>{% block title %}{% endblock %}</title>

</head>

<body class="font-sans bg-cover bg-center min-h-screen"
      style="background-image: url('https://www.pixelstalk.net/wp-content/uploads/2016/08/Library-Desktop-Wallpaper-768x480.jpg'); font-family: 'PT Sans', sans-serif;">

    <!-- NAVBAR -->
    <nav class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center h-16">

                <!-- Left -->
                <a href="/admin/dashboard" class="text-xl font-bold">
                    Admin
                </a>

                <!-- Right -->
                <div class="flex items-center gap-6">

                    {% block nav %}{% endblock %}

                    <a href="/add/book" class="hover:text-blue-400 transition">
                        Add Book
                    </a>

                    <a href="/remove/book" class="hover:text-blue-400 transition">
                        Remove Book
                    </a>

                    <a href="/admin/logout"
                       class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg transition">
                        Logout
                    </a>

                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="max-w-6xl mx-auto px-6 py-10 text-white drop-shadow-lg">

        {% block content %}{% endblock %}

        <hr class="my-10 border-white border-4 rounded">

        <footer class="text-center text-white">
            <p>&copy; {{ year }} - Library Management System - Kumar Aditya</p>
        </footer>

    </div>

    <script src="{{ url_for('static',filename='script.js')}}"></script>

</body>

</html>
